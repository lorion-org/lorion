name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.19
          - 22.17
          - 24
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The changeset gate compares against the base branch and needs its history.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            pnpm-workspace.yaml
            packages/*/package.json
            examples/*/package.json
            tools/*/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Bun for examples
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install browser for contribution acceptance
        run: pnpm exec playwright install --with-deps chromium

      - name: Run quality gate
        run: pnpm check

      - name: Require a changeset for package changes
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm run changeset:check

  bun:
    name: Bun compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js for pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22.17
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            pnpm-workspace.yaml
            packages/*/package.json
            examples/*/package.json
            tools/*/package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Verify packages on Bun
        run: pnpm run bun:check

      - name: Verify examples on Bun
        run: pnpm run examples:verify
