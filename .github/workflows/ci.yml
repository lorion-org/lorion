name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.19
          - 22.17
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The changeset gate compares against the base branch and needs its history.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            pnpm-workspace.yaml
            packages/*/package.json
            examples/*/package.json
            tools/*/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Prettier
        run: pnpm run format:check

      - name: Build packages
        run: pnpm run build

      - name: Verify package runtime on Node.js
        run: pnpm run runtime:check

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Check example snippets
        run: pnpm run snippets:check

      - name: Check package output
        run: pnpm run package:check

      - name: Check types across resolvers
        run: pnpm run attw

      - name: Read published declarations as a consumer does
        run: pnpm run declarations:check

      - name: Check published API reports
        run: pnpm run api:check

      - name: Validate bundle manifests
        run: pnpm run manifests:check

      - name: Setup Bun for examples
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Verify examples (dev-only; not part of the package build/typecheck gates)
        run: pnpm run examples:verify

      - name: Require a changeset for package changes
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm run changeset:check

  bun:
    name: Bun compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js for pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22.17
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            pnpm-workspace.yaml
            packages/*/package.json
            examples/*/package.json
            tools/*/package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Verify packages on Bun
        run: pnpm run bun:check

      - name: Verify examples on Bun
        run: pnpm run examples:verify
