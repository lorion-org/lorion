name: Bug report
description: Report a defect in a LORION package
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a report. Please fill in what you can.
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      options:
        - '@lorion-org/capability-composition'
        - '@lorion-org/composition-graph'
        - '@lorion-org/descriptor-discovery'
        - '@lorion-org/descriptor-selection'
        - '@lorion-org/provider-selection'
        - '@lorion-org/registry-hub'
        - '@lorion-org/runtime-config'
        - '@lorion-org/runtime-config-node'
        - '@lorion-org/react'
        - '@lorion-org/nuxt'
        - Not sure / other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.0.0-beta.2
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or a link to a minimal repository that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, bundler/framework and version (Vite, Nuxt), operating system.
      placeholder: |
        Node: 22.17
        Vite: 7.3
        OS: Ubuntu 24.04
    validations:
      required: false
